name: Release assets

# Run by hand from the Actions tab. Builds the plugin and attaches the phar
# and the zip to an existing release, so a download does not depend on
# whoever cut the release having a PHP install.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to attach the build to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          ini-values: phar.readonly=0

      - name: Build the phar and the zip
        run: php -d phar.readonly=0 tools/build.php

      - name: Check the phar still opens
        run: |
          php -r '
            $phar = new Phar(glob("build/*.phar")[0]);
            $meta = $phar->getMetadata();
            if (!isset($phar["src/stoneperms/StonePermsPlugin.php"])) {
              fwrite(STDERR, "The main class is not in the phar.\n");
              exit(1);
            }
            printf("%s %s, %d files\n", $meta["name"], $meta["version"], iterator_count(new RecursiveIteratorIterator($phar)));
          '

      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" build/*.phar build/*.zip --clobber
